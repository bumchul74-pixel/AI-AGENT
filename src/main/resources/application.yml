spring:
  application:
    name: AIP
  datasource:
    url: ${POSTGRES_URL:jdbc:postgresql://localhost:5432/mcp}
    username: ${POSTGRES_USERNAME:mcp}
    password: ${POSTGRES_PASSWORD:mcp}
    driver-class-name: org.postgresql.Driver
  neo4j:
    uri: ${NEO4J_URI:bolt://localhost:7687}
    authentication:
      username: ${NEO4J_USERNAME:neo4j}
      password: ${NEO4J_PASSWORD:neo4j_password}
  servlet:
    multipart:
      max-file-size: ${DOCUMENT_MAX_FILE_SIZE:100MB}
      max-request-size: ${DOCUMENT_MAX_REQUEST_SIZE:100MB}
  sql:
    init:
      mode: always
  ai:
    mcp:
      client:
        enabled: ${MCP_CLIENT_ENABLED:true}
        initialized: ${MCP_CLIENT_INITIALIZED:false}
        name: ai-agent-mcp-client
        version: 1.0.0
        request-timeout: 60s
        type: SYNC
        streamable-http:
          connections:
            ai-mcp:
              url: ${AI_MCP_BASE_URL:http://localhost:8092}
              endpoint: ${AI_MCP_ENDPOINT:/mcp}
            easyocr:
              url: ${EASYOCR_MCP_BASE_URL:http://localhost:8001}
              endpoint: ${EASYOCR_MCP_ENDPOINT:/ocr}
mcp:
  filesystem:
    root: ${MCP_FILESYSTEM_ROOT:d:\workspace\AI-AGENT}
mybatis:
  mapper-locations: classpath:/mapper/**/*.xml

agent:
  orchestration:
    config:
      database-enabled: ${AGENT_CONFIGURATION_DATABASE_ENABLED:true}
      seed-enabled: ${AGENT_CONFIGURATION_SEED_ENABLED:true}
      fallback-on-startup: ${AGENT_CONFIGURATION_FALLBACK_ON_STARTUP:true}
      refresh-mode: ${AGENT_CONFIGURATION_REFRESH_MODE:POLLING}
      refresh-interval-ms: ${AGENT_CONFIGURATION_REFRESH_INTERVAL_MS:30000}
      bootstrap-location: classpath:agent-orchestration-bootstrap.json
      admin-api-enabled: ${AGENT_CONFIGURATION_ADMIN_API_ENABLED:true}
      tool-sync-enabled: ${AGENT_CONFIGURATION_TOOL_SYNC_ENABLED:true}
      tool-sync-interval-ms: ${AGENT_CONFIGURATION_TOOL_SYNC_INTERVAL_MS:30000}
      tool-sync-initial-delay-ms: ${AGENT_CONFIGURATION_TOOL_SYNC_INITIAL_DELAY_MS:30000}
      # admin-token: ${AGENT_CONFIGURATION_ADMIN_TOKEN:} # 로그인/권한 기능 도입 시 사용
generation:
  project-structures:
    - name: Management Old Module
      value: 'D:\workspace\management'
    - name: Extension Module
      value: 'D:\workspace\extension'
source-graph:
  enabled: ${SOURCE_GRAPH_ENABLED:true}
server:
  port: 28081

llm:
  provider: ${LLM_PROVIDER:gemini}
  fallback-enabled: ${LLM_FALLBACK_ENABLED:false}
  fallback-provider: ${LLM_FALLBACK_PROVIDER:openai}

openai:
  api-key: ${OPENAI_API_KEY:}
  model: ${OPENAI_MODEL:gpt-5}
  base-url: https://api.openai.com/v1
  ssl:
    trust-all: ${OPENAI_SSL_TRUST_ALL:true}

gemini:
  api-key: ${GEMINI_API_KEY:}
  model: ${GEMINI_MODEL:gemini-2.5-flash}
  base-url: ${GEMINI_BASE_URL:https://generativelanguage.googleapis.com}

rag:
  base-url: ${RAG_SERVER_BASE_URL:http://localhost:8000}
  search-path: /api/search
  top-k: ${RAG_SEARCH_TOP_K:5}
  hybrid-graph-depth: ${RAG_HYBRID_GRAPH_DEPTH:2}
  hybrid-max-graph-nodes: ${RAG_HYBRID_MAX_GRAPH_NODES:50}
  hybrid-max-graph-relationships: ${RAG_HYBRID_MAX_GRAPH_RELATIONSHIPS:200}
  hybrid-max-evidence-chunks: ${RAG_HYBRID_MAX_EVIDENCE_CHUNKS:12}
  max-context-characters: ${RAG_MAX_CONTEXT_CHARACTERS:60000}
  watch:
    enabled: ${RAG_WATCH_ENABLED:true}
    directory: ${RAG_WATCH_DIR:rag-server/inbox}
    interval-seconds: ${RAG_WATCH_INTERVAL_SECONDS:30}
    source: ${RAG_WATCH_SOURCE:backend-source}
    document-upload-url: ${RAG_WATCH_DOCUMENT_UPLOAD_URL:http://localhost:8081/api/documents}
    source-graph-url: ${RAG_WATCH_SOURCE_GRAPH_URL:http://localhost:8081/api/source-graph/java-files}
    chunk-size: ${RAG_CHUNK_SIZE:1200}
    overlap: ${RAG_CHUNK_OVERLAP:150}
    min-file-age-seconds: ${RAG_WATCH_MIN_FILE_AGE_SECONDS:2}
document:
  storage-directory: ${DOCUMENT_STORAGE_DIR:uploads/documents}
  chunk-size: ${DOCUMENT_CHUNK_SIZE:1200}
  overlap: ${DOCUMENT_CHUNK_OVERLAP:150}
  project-id: ${DOCUMENT_PROJECT_ID:default}
  module-name: ${DOCUMENT_MODULE_NAME:main}
secure-coding:
  max-file-size: ${SECURE_CODING_MAX_FILE_SIZE:1MB}
  allowed-extensions:
    - java
  rule-sets: ${SECURE_CODING_RULE_SETS:}
  worker:
    core-size: ${SECURE_CODING_WORKER_CORE_SIZE:2}
    max-size: ${SECURE_CODING_WORKER_MAX_SIZE:4}
    queue-capacity: ${SECURE_CODING_QUEUE_CAPACITY:100}
    coordinator-queue-capacity: ${SECURE_CODING_COORDINATOR_QUEUE_CAPACITY:20}

ocr-chat:
  max-file-size: ${OCR_CHAT_MAX_FILE_SIZE:20MB}
  max-pdf-pages: ${OCR_CHAT_MAX_PDF_PAGES:10}
  allowed-extensions:
    - pdf
    - png
    - jpg
    - jpeg
    - bmp
    - gif
    - tif
    - tiff
    - webp

system-status:
  refresh-interval: ${SYSTEM_STATUS_REFRESH_INTERVAL:30s}
  initial-delay: ${SYSTEM_STATUS_INITIAL_DELAY:2s}
  connect-timeout: ${SYSTEM_STATUS_CONNECT_TIMEOUT:2s}
